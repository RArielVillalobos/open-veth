services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openveth-backend
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/app/data
    network_mode: bridge
    ports:
      - "8080:8080"
    pid: host
    environment:
      - SERVER_ADDRESS=:8080
      - DB_DRIVER=sqlite
      - DB_DSN=/app/data/openveth.db
      - AUTO_SAVE_INTERVAL=30
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openveth-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
