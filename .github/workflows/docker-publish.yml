name: Build and Push Node Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: ./images/base-node
          push: true
          tags: openveth/base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build-nodes:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - name: host
            context: ./images/host-node
          - name: router
            context: ./images/router-node
          - name: server
            context: ./images/server-node
          - name: monitor
            context: ./images/monitor-node
          - name: tester
            context: ./images/tester-node
          - name: haproxy
            context: ./images/haproxy-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: openveth/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
