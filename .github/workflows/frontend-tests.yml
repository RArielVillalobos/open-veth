name: Frontend tests

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-tests.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-tests.yml']

permissions:
  contents: read

jobs:
  test:
    # Playwright 1.58.x supports Ubuntu 24.04; keep the runner reproducible.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --reporter=line
