<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Central node -->
  <circle cx="50" cy="50" r="10" fill="#6366f1"/>

  <!-- Top-left node -->
  <circle cx="20" cy="22" r="7" fill="#818cf8"/>
  <!-- Link: central -> top-left -->
  <line x1="41" y1="43" x2="26" y2="28" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>

  <!-- Top-right node -->
  <circle cx="80" cy="22" r="7" fill="#818cf8"/>
  <!-- Link: central -> top-right -->
  <line x1="59" y1="43" x2="74" y2="28" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom-left node -->
  <circle cx="18" cy="78" r="7" fill="#818cf8"/>
  <!-- Link: central -> bottom-left -->
  <line x1="41" y1="57" x2="24" y2="72" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom-right node -->
  <circle cx="82" cy="78" r="7" fill="#818cf8"/>
  <!-- Link: central -> bottom-right -->
  <line x1="59" y1="57" x2="76" y2="72" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
</svg>
