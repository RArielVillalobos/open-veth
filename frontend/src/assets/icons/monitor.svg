<svg viewBox="4 4 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17819b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b6c82;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="6" y="8" width="52" height="48" rx="6" fill="url(#monitorGrad)"/>

  <!-- Chart area -->
  <rect x="10" y="13" width="44" height="29" rx="2" fill="#083344" opacity="0.65"/>

  <!-- Grid lines (subtle) -->
  <line x1="10" y1="23" x2="54" y2="23" stroke="#0e7490" stroke-width="0.5" opacity="0.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#0e7490" stroke-width="0.5" opacity="0.5"/>

  <!-- Metric line -->
  <polyline points="13,38 19,28 25,33 31,20 37,25 43,15 51,19"
            fill="none" stroke="#22d3ee" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Data points -->
  <circle cx="19" cy="28" r="2" fill="#22d3ee"/>
  <circle cx="31" cy="20" r="2" fill="#22d3ee"/>
  <circle cx="43" cy="15" r="2.5" fill="#f0f9ff"/>

  <!-- Bottom bar — Grafana / Prometheus indicator -->
  <rect x="10" y="46" width="44" height="7" rx="2" fill="#083344" opacity="0.5"/>
  <rect x="13" y="48.5" width="10" height="2" rx="1" fill="#f97316"/>
  <rect x="25" y="48.5" width="7" height="2" rx="1" fill="#22d3ee"/>
  <rect x="34" y="48.5" width="5" height="2" rx="1" fill="#4ade80"/>
</svg>
