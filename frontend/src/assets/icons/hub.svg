<svg viewBox="-2 -2 68 68" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main hexagon body -->
  <polygon points="32,8 56,20 56,44 32,56 8,44 8,20" 
           fill="url(#hubGrad)" 
           filter="url(#hubShadow)"
           stroke="rgba(255,255,255,0.2)"
           stroke-width="1"/>
  
  <!-- Center circle -->
  <circle cx="32" cy="32" r="8" fill="white" opacity="0.9"/>
  
  <!-- Connection points (ports) -->
  <g fill="white" opacity="0.7">
    <!-- Top -->
    <circle cx="32" cy="16" r="3"/>
    <!-- Top-right -->
    <circle cx="48" cy="24" r="3"/>
    <!-- Bottom-right -->
    <circle cx="48" cy="40" r="3"/>
    <!-- Bottom -->
    <circle cx="32" cy="48" r="3"/>
    <!-- Bottom-left -->
    <circle cx="16" cy="40" r="3"/>
    <!-- Top-left -->
    <circle cx="16" cy="24" r="3"/>
  </g>
  
  <!-- Connection lines from center to ports -->
  <g stroke="white" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="19"/>
    <line x1="32" y1="32" x2="45" y2="26"/>
    <line x1="32" y1="32" x2="45" y2="38"/>
    <line x1="32" y1="32" x2="32" y2="45"/>
    <line x1="32" y1="32" x2="19" y2="38"/>
    <line x1="32" y1="32" x2="19" y2="26"/>
  </g>
</svg>
