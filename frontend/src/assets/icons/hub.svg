<svg viewBox="4 4 56 56" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Hub</title>
  <defs>
    <linearGradient id="ov-hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#616a76;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#495460;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main hexagon body -->
  <polygon points="32,8 56,20 56,44 32,56 8,44 8,20"
           fill="url(#ov-hubGrad)"
           stroke="rgba(255,255,255,0.25)"
           stroke-width="1"/>

  <!-- Connection lines from center to ports (drawn first so ports sit on top) -->
  <g stroke="white" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="16"/>
    <line x1="32" y1="32" x2="48" y2="24"/>
    <line x1="32" y1="32" x2="48" y2="40"/>
    <line x1="32" y1="32" x2="32" y2="48"/>
    <line x1="32" y1="32" x2="16" y2="40"/>
    <line x1="32" y1="32" x2="16" y2="24"/>
  </g>

  <!-- Connection points (ports) -->
  <g fill="white">
    <!-- Top -->
    <circle cx="32" cy="16" r="3.5"/>
    <!-- Top-right -->
    <circle cx="48" cy="24" r="3.5"/>
    <!-- Bottom-right -->
    <circle cx="48" cy="40" r="3.5"/>
    <!-- Bottom -->
    <circle cx="32" cy="48" r="3.5"/>
    <!-- Bottom-left -->
    <circle cx="16" cy="40" r="3.5"/>
    <!-- Top-left -->
    <circle cx="16" cy="24" r="3.5"/>
  </g>

  <!-- Port LEDs (activity indicators) -->
  <g>
    <circle cx="32" cy="16" r="1.5" fill="#4ade80"/>
    <circle cx="48" cy="24" r="1.5" fill="#4ade80" opacity="0.8"/>
    <circle cx="48" cy="40" r="1.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="32" cy="48" r="1.5" fill="#4ade80" opacity="0.6"/>
    <circle cx="16" cy="40" r="1.5" fill="#4ade80" opacity="0.7"/>
    <circle cx="16" cy="24" r="1.5" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Center circle (core) -->
  <circle cx="32" cy="32" r="9" fill="white" opacity="0.12"/>
  <circle cx="32" cy="32" r="5" fill="white" opacity="0.25"/>

  <!-- Broadcast/activity glow in center -->
  <circle cx="32" cy="32" r="2.5" fill="#fbbf24" opacity="0.9"/>
</svg>
