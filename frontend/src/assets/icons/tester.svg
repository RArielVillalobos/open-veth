<svg viewBox="4 4 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="testerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be123c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="6" y="6" width="52" height="52" rx="6" fill="url(#testerGrad)"/>

  <!-- Inner dark gauge area -->
  <rect x="10" y="10" width="44" height="36" rx="3" fill="#4c0519" opacity="0.55"/>

  <!-- Gauge track (background arc) center=(32,38) r=20 -->
  <path d="M 12 38 A 20 20 0 0 1 52 38"
        fill="none" stroke="#6b0926" stroke-width="5" stroke-linecap="round"/>

  <!-- Green zone (low load): 180° → 120° -->
  <path d="M 12 38 A 20 20 0 0 1 22 21"
        fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Yellow zone (medium load): 120° → 60° -->
  <path d="M 22 21 A 20 20 0 0 1 42 21"
        fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Red zone (high load): 60° → 0° -->
  <path d="M 42 21 A 20 20 0 0 1 52 38"
        fill="none" stroke="#fda4af" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Tick marks -->
  <line x1="12" y1="38" x2="15" y2="38" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="18" x2="32" y2="21" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="52" y1="38" x2="49" y2="38" stroke="white" stroke-width="1.5" opacity="0.6"/>

  <!-- Needle pointing into red zone (~30° from right) -->
  <line x1="32" y1="38" x2="45" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Needle pivot -->
  <circle cx="32" cy="38" r="3.5" fill="white"/>
  <circle cx="32" cy="38" r="1.5" fill="#be123c"/>

  <!-- Bottom info bar -->
  <rect x="10" y="48" width="44" height="8" rx="2" fill="#4c0519" opacity="0.5"/>

  <!-- Activity dots representing increasing load -->
  <circle cx="18" cy="52" r="2" fill="#4ade80"/>
  <circle cx="25" cy="52" r="2" fill="#86efac"/>
  <circle cx="32" cy="52" r="2" fill="#fbbf24"/>
  <circle cx="39" cy="52" r="2" fill="#fda4af"/>
  <circle cx="46" cy="52" r="2" fill="#fb7185"/>
</svg>
