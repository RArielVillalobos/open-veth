<svg viewBox="4 4 56 56" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Zabbix</title>
  <defs>
    <linearGradient id="ov-zabbixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Chassis -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="url(#ov-zabbixGrad)"/>

  <!-- Screen -->
  <rect x="12" y="12" width="40" height="28" rx="2" fill="#1c0000" opacity="0.75"/>

  <!-- Graph line (monitoring data) -->
  <polyline
    points="15,34 20,27 25,31 30,19 35,24 40,15 45,21 50,17"
    stroke="#4ade80" stroke-width="1.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Alert indicator -->
  <circle cx="47" cy="15" r="2.5" fill="#facc15"/>

  <!-- Bottom bar: status indicators -->
  <rect x="12" y="44" width="8"  height="3" rx="1.5" fill="#4ade80" opacity="0.9"/>
  <rect x="23" y="44" width="8"  height="3" rx="1.5" fill="#4ade80" opacity="0.9"/>
  <rect x="34" y="44" width="8"  height="3" rx="1.5" fill="#facc15" opacity="0.9"/>
  <rect x="45" y="44" width="7"  height="3" rx="1.5" fill="#f87171" opacity="0.9"/>
</svg>
