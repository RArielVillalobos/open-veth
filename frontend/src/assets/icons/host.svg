<svg viewBox="4 4 56 56" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Host</title>
  <defs>
    <linearGradient id="ov-hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d9f76;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#148564;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Monitor body -->
  <rect x="10" y="10" width="44" height="32" rx="4" fill="url(#ov-hostGrad)"/>

  <!-- Screen -->
  <rect x="14" y="14" width="36" height="24" rx="2" fill="#064e3b"/>

  <!-- Terminal content -->
  <g fill="#34d399">
    <rect x="18" y="18" width="16" height="2" rx="1" opacity="0.9"/>
    <rect x="18" y="24" width="12" height="2" rx="1" opacity="0.7"/>
    <rect x="18" y="30" width="20" height="2" rx="1" opacity="0.5"/>
  </g>

  <!-- Stand neck -->
  <rect x="26" y="42" width="12" height="4" fill="#059669"/>

  <!-- Stand base -->
  <rect x="22" y="46" width="20" height="3" rx="1.5" fill="#047857"/>

  <!-- Keyboard -->
  <rect x="16" y="51" width="32" height="3" rx="1" fill="#065f46"/>
  <rect x="18" y="52" width="28" height="1" rx="0.5" fill="#34d399" opacity="0.4"/>

  <!-- Power LED -->
  <circle cx="46" cy="18" r="1.8" fill="#4ade80" opacity="0.9"/>
</svg>
