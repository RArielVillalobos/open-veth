<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="hostShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Monitor body -->
  <rect x="10" y="12" width="44" height="32" rx="4" fill="url(#hostGrad)" filter="url(#hostShadow)"/>
  
  <!-- Screen -->
  <rect x="14" y="16" width="36" height="24" rx="2" fill="#064e3b"/>
  
  <!-- Terminal content -->
  <g fill="#34d399">
    <rect x="18" y="20" width="16" height="2" rx="1" opacity="0.9"/>
    <rect x="18" y="26" width="12" height="2" rx="1" opacity="0.7"/>
    <rect x="18" y="32" width="20" height="2" rx="1" opacity="0.5"/>
  </g>
  
  <!-- Stand -->
  <rect x="26" y="44" width="12" height="4" fill="#059669"/>
  <rect x="22" y="48" width="20" height="4" rx="2" fill="#047857"/>
  
  <!-- Power LED -->
  <circle cx="50" cy="20" r="2" fill="#4ade80" opacity="0.8"/>
</svg>
