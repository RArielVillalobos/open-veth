<svg viewBox="-2 -2 68 68" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="routerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="32" cy="32" r="26" fill="url(#routerGrad)" filter="url(#routerShadow)"/>
  
  <!-- Inner highlight -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Central routing symbol -->
  <g fill="white" opacity="0.9">
    <!-- Cross -->
    <rect x="30" y="16" width="4" height="32" rx="1"/>
    <rect x="16" y="30" width="32" height="4" rx="1"/>
    
    <!-- Arrow heads -->
    <path d="M32 12 L36 16 H28 Z"/>
    <path d="M32 52 L28 48 H36 Z"/>
    <path d="M12 32 L16 28 V36 Z"/>
    <path d="M52 32 L48 36 V28 Z"/>
  </g>
</svg>
