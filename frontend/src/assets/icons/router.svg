<svg viewBox="4 4 56 56" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Router</title>
  <defs>
    <linearGradient id="ov-routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d76ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264fb8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle with gradient -->
  <circle cx="32" cy="32" r="25" fill="url(#ov-routerGrad)"/>

  <!-- Inner highlight -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Central routing symbol -->
  <g stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <!-- Cross -->
    <line x1="32" y1="17" x2="32" y2="47"/>
    <line x1="17" y1="32" x2="47" y2="32"/>
  </g>

  <!-- Directional chevrons -->
  <g fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- North -->
    <path d="M28 17 L32 13 L36 17"/>
    <!-- South -->
    <path d="M28 47 L32 51 L36 47"/>
    <!-- West -->
    <path d="M17 28 L13 32 L17 36"/>
    <!-- East -->
    <path d="M47 28 L51 32 L47 36"/>
  </g>
</svg>
