<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="routerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle with gradient -->
  <circle cx="32" cy="32" r="28" fill="url(#routerGrad)" filter="url(#routerShadow)"/>
  
  <!-- Inner highlight -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Central routing symbol -->
  <g fill="white" opacity="0.9">
    <!-- Cross -->
    <rect x="30" y="14" width="4" height="36" rx="1"/>
    <rect x="14" y="30" width="36" height="4" rx="1"/>
    
    <!-- Arrow heads -->
    <path d="M32 8 L36 14 H28 Z"/>
    <path d="M32 56 L28 50 H36 Z"/>
    <path d="M8 32 L14 28 V36 Z"/>
    <path d="M56 32 L50 36 V28 Z"/>
  </g>
</svg>
