<svg viewBox="-2 -2 68 68" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="switchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main body with gradient -->
  <rect x="4" y="8" width="56" height="48" rx="8" fill="url(#switchGrad)" filter="url(#switchShadow)"/>
  
  <!-- Inner highlight line -->
  <rect x="8" y="12" width="48" height="40" rx="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Switch ports/lights -->
  <g fill="white" opacity="0.9">
    <circle cx="18" cy="32" r="4"/>
    <circle cx="28" cy="32" r="4"/>
    <circle cx="36" cy="32" r="4"/>
    <circle cx="46" cy="32" r="4"/>
  </g>
  
  <!-- Bidirectional arrows -->
  <g fill="white" opacity="0.6">
    <path d="M6 22 L12 19 V25 Z"/>
    <path d="M58 22 L52 19 V25 Z"/>
    <path d="M6 42 L12 39 V45 Z"/>
    <path d="M58 42 L52 39 V45 Z"/>
  </g>
</svg>
