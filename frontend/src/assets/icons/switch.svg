<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="switchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main body with gradient -->
  <rect x="6" y="18" width="52" height="28" rx="6" fill="url(#switchGrad)" filter="url(#switchShadow)"/>
  
  <!-- Inner highlight line -->
  <rect x="10" y="22" width="44" height="20" rx="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Switch ports/lights -->
  <g fill="white" opacity="0.9">
    <circle cx="18" cy="32" r="3"/>
    <circle cx="28" cy="32" r="3"/>
    <circle cx="36" cy="32" r="3"/>
    <circle cx="46" cy="32" r="3"/>
  </g>
  
  <!-- Bidirectional arrows -->
  <g fill="white" opacity="0.6">
    <path d="M8 26 L12 24 V28 Z"/>
    <path d="M56 26 L52 24 V28 Z"/>
    <path d="M8 38 L12 36 V40 Z"/>
    <path d="M56 38 L52 36 V40 Z"/>
  </g>
</svg>
