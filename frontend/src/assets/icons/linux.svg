<svg viewBox="-2 -2 68 68" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="linuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <filter id="linuxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Monitor body -->
  <rect x="10" y="12" width="44" height="32" rx="4" fill="url(#linuxGrad)" filter="url(#linuxShadow)"/>

  <!-- Screen -->
  <rect x="14" y="16" width="36" height="24" rx="2" fill="#450a0a"/>

  <!-- Terminal prompt $ -->
  <text x="18" y="28" font-family="monospace" font-size="9" fill="#fca5a5" font-weight="bold">$_</text>

  <!-- Script lines -->
  <g fill="#f87171">
    <rect x="18" y="32" width="20" height="2" rx="1" opacity="0.8"/>
    <rect x="18" y="36" width="14" height="2" rx="1" opacity="0.5"/>
  </g>

  <!-- Python logo hint: small snake shape (two dots) -->
  <circle cx="47" cy="20" r="2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="47" cy="25" r="2" fill="#60a5fa" opacity="0.9"/>

  <!-- Stand -->
  <rect x="26" y="44" width="12" height="4" fill="#991b1b"/>
  <rect x="22" y="48" width="20" height="4" rx="2" fill="#7f1d1d"/>
</svg>
