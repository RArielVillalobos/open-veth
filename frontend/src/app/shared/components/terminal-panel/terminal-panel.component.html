<div class="terminal-panel">
  <!-- Tabs Header -->
  <div class="terminal-panel__header">
    <div class="tabs-container">
      <div 
        *ngFor="let t of terminalStore.sessions()" 
        class="tab" 
        [class.tab--active]="t.nodeId === terminalStore.activeNodeId()"
        (click)="setActiveTab(t.nodeId)">
        <span class="icon">&gt;_</span>
        <span class="label">{{ t.nodeName }}</span>
        <button class="close-btn" (click)="$event.stopPropagation(); closeTerminal(t.nodeId)">×</button>
      </div>
    </div>
    
    <!-- Controls -->
    <div class="controls">
      <button class="clear-btn" (click)="clearActiveTerminal()" title="Clear Scrollback">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        Clear
      </button>
    </div>
  </div>

  <!-- Terminal Content (Mantener todos en DOM pero ocultar los inactivos para no perder sesión) -->
  <div class="terminal-panel__body">
    <div 
      *ngFor="let t of terminalStore.sessions()" 
      #termContainer
      [attr.data-node-id]="t.nodeId"
      class="xterm-wrapper"
      [class.tab--inactive]="t.nodeId !== terminalStore.activeNodeId()">
    </div>
  </div>
</div>
