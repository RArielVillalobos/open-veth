<div class="canvas-overlay">
  <div *ngIf="sourceNodeId" class="linking-indicator">
    🔗 Linking from: <strong>{{ getNodeName(sourceNodeId) }}</strong> (Click another node to connect)
    <button (click)="cancelLinking()">Cancel</button>
  </div>
</div>

<!-- Context Menu -->
<div *ngIf="contextMenu.visible" 
     class="context-menu"
     [style.top.px]="contextMenu.y" 
     [style.left.px]="contextMenu.x">
  <div class="context-menu__header">{{ contextMenu.elementName }}</div>
  
  <!-- Solo para Nodos -->
  <button *ngIf="contextMenu.elementType !== 'switch' && contextMenu.elementType !== 'edge'" 
          class="context-menu__item" (click)="onContextMenuAction('terminal')">
    <span class="icon">💻</span> Open Terminal
  </button>
  
  <button *ngIf="contextMenu.elementType !== 'edge'" 
          class="context-menu__item" (click)="onContextMenuAction('properties')">
    <span class="icon">ℹ️</span> Properties
  </button>

  <div *ngIf="contextMenu.elementType !== 'edge'" class="context-menu__separator"></div>

  <!-- Común para todos -->
    @if (contextMenu.elementType === 'edge') {
      <div class="context-menu__header">Packet Capture</div>
      <button class="context-menu__item" (click)="triggerOpenSniff(contextMenu.sourceNode)">
        <span class="icon">🔍</span> Sniff on {{ contextMenu.sourceNode.nodeName }} ({{ contextMenu.sourceNode.iface }})
      </button>
      <button class="context-menu__item" (click)="triggerOpenSniff(contextMenu.targetNode)">
        <span class="icon">🔍</span> Sniff on {{ contextMenu.targetNode.nodeName }} ({{ contextMenu.targetNode.iface }})
      </button>
      <div class="context-menu__separator"></div>
    }

    <button class="context-menu__item text-red-600" (click)="onContextMenuAction('delete')">
      <span class="icon">🗑️</span> Delete {{ contextMenu.elementType === 'edge' ? 'Link' : 'Node' }}
    </button>

</div>

<div #cyContainer class="cy-container"></div>
