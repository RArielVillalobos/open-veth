<div class="h-full bg-slate-900 border-r border-slate-700 flex flex-col p-3 w-52">
  <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3">Nodes</h2>

  <div class="flex flex-col gap-1.5">
    @for (nt of nodeTypeConfigs; track nt.id) {
      <button (click)="startNaming(nt.id)"
              [class]="'flex items-center gap-2.5 px-2.5 py-2 rounded-md bg-slate-800/50 hover:bg-slate-800 transition-all border border-slate-700/50 group ' + nt.hoverBorder + (pendingType() === nt.id ? ' ' + nt.accentBorder : '')">
        <img [src]="'assets/icons/' + nt.icon" [alt]="nt.label" class="w-8 h-8 flex-shrink-0">
        <div class="flex flex-col items-start">
          <span class="text-xs font-medium text-slate-200 group-hover:text-white">{{ nt.label }}</span>
          <span class="text-[10px] text-slate-500">{{ nt.subtitle }}</span>
        </div>
      </button>

      @if (pendingType() === nt.id) {
        <div class="px-2 pb-1">
          <input #nameInputEl type="text"
                 [formControl]="nameCtrl"
                 (keydown.enter)="confirmName()"
                 (keydown.escape)="cancelNaming()"
                 [maxLength]="20"
                 [placeholder]="nt.placeholder"
                 [class]="inputClasses()">
          <div class="flex items-center gap-1 mt-1.5">
            <button type="button" (click)="confirmName()"
                    [disabled]="!canConfirm()"
                    [class]="'flex-1 text-[11px] px-2 py-1 rounded font-medium transition-colors ' + (canConfirm()
                      ? 'bg-blue-600 hover:bg-blue-500 text-white'
                      : 'bg-slate-700 text-slate-500 cursor-not-allowed')">
              Add
            </button>
            <button type="button" (click)="cancelNaming()"
                    class="px-2 py-1 text-[11px] rounded text-slate-400 hover:text-slate-200 hover:bg-slate-700 transition-colors">
              Cancel
            </button>
          </div>
          @if (nameError()) {
            <p class="text-[10px] text-red-400 mt-1">{{ nameError() }}</p>
          }
        </div>
      }
    }
  </div>

  <div class="mt-auto pt-4">
    <p class="text-[10px] text-slate-600 text-center">
      Press <kbd class="px-1 py-0.5 bg-slate-800 rounded text-slate-500">R</kbd>
      <kbd class="px-1 py-0.5 bg-slate-800 rounded text-slate-500 mx-0.5">S</kbd>
      <kbd class="px-1 py-0.5 bg-slate-800 rounded text-slate-500">H</kbd>
    </p>
  </div>
</div>
