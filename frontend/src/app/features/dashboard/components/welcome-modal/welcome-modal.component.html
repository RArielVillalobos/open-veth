<div
  class="absolute inset-0 z-40 flex items-center justify-center bg-black/50 backdrop-blur-[2px]"
  (click)="onBackdropClick($event)">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-[340px] overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-200">

    <!-- Header -->
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-950 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <img src="assets/logo.svg" alt="OpenVeth logo" class="w-6 h-6"/>
        </div>
        <div>
          <h2 class="text-lg font-bold text-white tracking-tight">OpenVeth</h2>
          <p class="text-[10px] text-slate-500">Network Emulator</p>
        </div>
      </div>
      <button
        (click)="close.emit()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:text-white hover:bg-slate-800 transition-colors"
        title="Close (Esc)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Actions -->
    <div class="p-5 flex flex-col gap-3">
      <button
        (click)="createLab.emit(); close.emit()"
        class="flex items-center gap-3 p-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-lg shadow-indigo-500/20 group text-left border border-indigo-500">
        <div class="bg-white/20 p-2 rounded-lg group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <div>
          <span class="block font-semibold">New Topology</span>
          <span class="text-xs text-indigo-200/70">Start with empty canvas</span>
        </div>
      </button>

      <button
        (click)="importLab.emit(); close.emit()"
        class="flex items-center gap-3 p-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700 hover:border-slate-600 group text-left">
        <div class="bg-slate-700 p-2 rounded-lg group-hover:bg-slate-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div>
          <span class="block font-semibold group-hover:text-white">Import YAML</span>
          <span class="text-xs text-slate-500">Load from file</span>
        </div>
      </button>

      <button
        (click)="openLabManager.emit(); close.emit()"
        class="flex items-center gap-3 p-4 rounded-xl bg-slate-800/50 hover:bg-slate-800 text-slate-400 transition-all border border-slate-700/50 hover:border-slate-600 group text-left">
        <div class="bg-slate-800 p-2 rounded-lg group-hover:bg-slate-700 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div>
          <span class="block font-semibold group-hover:text-slate-200">My Labs</span>
          <span class="text-xs text-slate-600">Open saved topologies</span>
        </div>
      </button>
    </div>

    <!-- Footer hint -->
    <div class="px-5 pb-4">
      <p class="text-[10px] text-slate-600 text-center">
        Press <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-400 font-mono">R</kbd>
        <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-400 font-mono mx-1">S</kbd>
        <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-400 font-mono">H</kbd>
        to add nodes
      </p>
    </div>
  </div>
</div>
