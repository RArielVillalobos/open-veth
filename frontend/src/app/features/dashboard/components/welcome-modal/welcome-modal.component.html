<div class="welcome-backdrop" (click)="onBackdropClick($event)">
  <section class="welcome-dialog" role="dialog" aria-modal="true" aria-labelledby="welcome-title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <header><h2 id="welcome-title">OpenVeth</h2><button (click)="close.emit()" aria-label="Close welcome dialog" title="Close (Esc)">&times;</button></header>
    <p class="welcome-description">Network emulator</p>
    <nav aria-label="Start working">
      <button (click)="createLab.emit(); close.emit()"><span>New Topology</span><span>Empty workspace</span></button>
      <button (click)="importLab.emit(); close.emit()"><span>Import YAML</span><span>Load a topology file</span></button>
      <button (click)="openLabManager.emit(); close.emit()"><span>Laboratories</span><span>Open an existing laboratory</span></button>
    </nav>
    <p class="welcome-hint">Device shortcuts: <kbd>R</kbd> router, <kbd>S</kbd> switch, <kbd>H</kbd> host</p>
  </section>
</div>
