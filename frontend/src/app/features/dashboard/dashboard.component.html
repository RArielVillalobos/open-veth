<div class="h-screen flex flex-col bg-slate-900 text-white overflow-hidden">
  
  <!-- Top Bar -->
  <header class="h-12 border-b border-slate-700 bg-slate-950 flex items-center justify-between px-4 shrink-0 z-10">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 bg-indigo-600 rounded flex items-center justify-center font-bold text-xs">OV</div>
      <h1 class="text-sm font-semibold tracking-tight text-slate-200 flex items-center gap-3">
        OpenVeth
        <button (click)="onRename()"
                class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-800 border border-slate-700 hover:border-indigo-500/50 hover:bg-slate-800/80 transition-colors group"
                title="Manage Laboratories">
          <span class="text-indigo-400 font-medium">{{ store.topology().name }}</span>
          <span class="text-slate-500 group-hover:text-indigo-400 transition-colors text-[10px]">▼</span>
        </button>
      </h1>
    </div>

    <div class="flex items-center gap-3">
      <div *ngIf="store.isLoading()" class="flex items-center gap-2 text-xs text-blue-400">
        <span class="animate-spin">⟳</span> Saving...
      </div>

      <button (click)="store.syncState()"
              class="w-8 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 transition-colors"
              title="Force refresh interfaces">
        ↻
      </button>

      <button (click)="onSaveState()"
              class="text-xs bg-slate-800 hover:bg-green-900/50 text-slate-200 hover:text-green-400 px-3 py-1.5 rounded border border-slate-700 hover:border-green-700/50 transition-colors flex items-center gap-2"
              title="Save current IP configurations to persist across lab activations">
        <span>●</span> Save State
      </button>

      <button (click)="onExport()" 
              class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded border border-slate-700 transition-colors flex items-center gap-2">
        <span>↓</span> Export
      </button>

      <button (click)="fileInput.click()" 
              class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded transition-colors flex items-center gap-2">
        <span>↑</span> Import
      </button>

      <input type="file" #fileInput class="hidden" (change)="onImport($event)" accept=".yaml,.yml">

      <button (click)="onCleanupLab()"
              class="text-xs bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 px-3 py-1.5 rounded border border-slate-700 hover:border-red-900/50 transition-colors flex items-center gap-1.5"
              title="Delete all nodes and links in this lab">
        <span>↺</span> Reset Lab
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex overflow-hidden">
      
      <!-- Left: Component Library (Fixed) -->
      <app-node-palette class="shrink-0" [nodes]="store.topology().nodes" (addNode)="onAddNode($event)"></app-node-palette>

      <!-- Center: Canvas -->
      <div class="flex-1 flex flex-col min-w-0 bg-slate-950 h-full relative">
          <!-- Canvas Area -->
          <div class="flex-1 relative overflow-hidden">
            <app-topology-canvas
                [nodes]="store.topology().nodes"
                [links]="store.topology().links"
                [terminalNode]="terminalStore.activeNodeId()"
                (linkRequest)="onLinkRequest($event)"
                (nodeMoved)="store.updateNodePosition($event.id, $event.x, $event.y)"
                (openTerminalRequest)="openTerminal($event)"
                (openSniffRequest)="captureStore.openCapture($event.nodeId, $event.nodeName, $event.iface)"
                (nodeSelected)="onNodeSelected($event)"
                (linkSelected)="onLinkSelected($event)"
                (nodeDelete)="onDeleteNode($event)"
                (linkDelete)="onDeleteLink($event)">
            </app-topology-canvas>
          </div>
          
          <!-- Integrated Terminal (Only takes space from center) -->
          <div *ngIf="terminalStore.isOpen()" 
               class="h-64 border-t border-slate-700 bg-slate-900 shrink-0 z-10 overflow-hidden">
            <app-terminal-panel></app-terminal-panel>
          </div>
      </div>

      <!-- Right: Properties Inspector (Fixed) -->
      <app-properties-panel *ngIf="selectedNode() || selectedLink()" class="shrink-0"
          [selectedNode]="selectedNode()"
          [selectedLink]="selectedLink()"
          (openTerminal)="selectedNode() && openTerminal(selectedNode()!.id)"
          (openCapture)="onOpenCapture($any($event))"
          (deleteNode)="onDeleteNode($event)"
          (deleteLink)="onDeleteLink($event)"
          (close)="onNodeSelected(null)">
      </app-properties-panel>
  </div>

  <!-- Floating Windows Layer (Captures) -->
  <app-capture-container></app-capture-container>

  <!-- Global Toasts -->
  <app-toast></app-toast>

  <!-- Lab Manager Modal -->
  <app-lab-manager *ngIf="ui.isLabManagerOpen()" (close)="ui.toggleLabManager(false)"></app-lab-manager>

  <!-- Welcome / Start Screen -->
  <app-welcome-modal
    *ngIf="showWelcomeModal()"
    (createLab)="ui.markInteraction()"
    (importLab)="fileInput.click()"
    (openLabManager)="ui.toggleLabManager(true)"
    (close)="ui.markInteraction()">
  </app-welcome-modal>
</div>
