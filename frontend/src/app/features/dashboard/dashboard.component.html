<div class="h-screen flex flex-col bg-slate-900 text-white overflow-hidden">
  
  <!-- Top Bar -->
  <header class="h-14 border-b border-slate-700 bg-slate-950 flex items-center justify-between px-4 shrink-0 z-10">
    <!-- Left: Brand & Lab Selector -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <span class="text-white text-xs font-extrabold leading-none">OV</span>
        </div>
        <span class="font-bold text-slate-100 tracking-tight">OpenVeth</span>
      </div>
      
      <div class="h-6 w-px bg-slate-700 mx-1"></div>
      
      <button (click)="onRename()"
              class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/50 border border-slate-700 hover:border-indigo-500/50 hover:bg-slate-800 transition-all group"
              title="Manage Laboratories (Ctrl+L)">
        <span class="text-sm font-medium text-slate-200">{{ store.topology().name }}</span>
        <svg class="w-3 h-3 text-slate-500 group-hover:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Save Status Indicator -->
      <div class="flex items-center gap-1.5 text-xs" [class.text-emerald-400]="!store.isLoading()" [class.text-amber-400]="store.isLoading()">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" [class.bg-emerald-400]="!store.isLoading()" [class.bg-amber-400]="store.isLoading()"></span>
          <span class="relative inline-flex rounded-full h-2 w-2" [class.bg-emerald-500]="!store.isLoading()" [class.bg-amber-500]="store.isLoading()"></span>
        </span>
        <span class="font-medium">{{ store.isLoading() ? 'Saving...' : 'Saved' }}</span>
      </div>
    </div>

    <!-- Right: Action Buttons -->
    <div class="flex items-center gap-2">
      <!-- State Actions Group -->
      <div class="flex items-center gap-1.5 p-1 bg-slate-900/50 rounded-lg border border-slate-800">
        <button (click)="store.syncState()"
                class="h-8 w-8 flex items-center justify-center rounded-md hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition-all"
                title="Refresh Interfaces (Ctrl+R)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>

        <button (click)="onSaveState()"
                class="h-8 px-3 flex items-center gap-1.5 rounded-md hover:bg-emerald-900/30 text-slate-300 hover:text-emerald-400 transition-all text-xs font-medium"
                title="Save State (Ctrl+S)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
          </svg>
          Save
        </button>
      </div>

      <!-- Domain Overlay Group -->
      <div class="flex items-center gap-1.5 p-1 bg-slate-900/50 rounded-lg border border-slate-800">
        <button (click)="store.setDomainOverlay('broadcast')"
                class="h-8 px-3 flex items-center gap-1.5 rounded-md text-xs font-medium transition-all"
                [class]="store.activeDomainOverlay() === 'broadcast'
                  ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/25'
                  : 'hover:bg-slate-700 text-slate-300 hover:text-slate-100'"
                title="Broadcast Domains">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.858 15.355-5.858 21.213 0"></path>
          </svg>
          BD
          <span *ngIf="store.domains()" class="ml-0.5 opacity-70">{{ store.domains()!.broadcast_domains.length }}</span>
        </button>
        <button (click)="store.setDomainOverlay('collision')"
                class="h-8 px-3 flex items-center gap-1.5 rounded-md text-xs font-medium transition-all"
                [class]="store.activeDomainOverlay() === 'collision'
                  ? 'bg-amber-600 text-white shadow-lg shadow-amber-500/25'
                  : 'hover:bg-slate-700 text-slate-300 hover:text-slate-100'"
                title="Collision Domains">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          CD
          <span *ngIf="store.domains()" class="ml-0.5 opacity-70">{{ store.domains()!.collision_domains.length }}</span>
        </button>
      </div>

      <div class="h-6 w-px bg-slate-800"></div>

      <!-- Import/Export Group -->
      <div class="flex items-center gap-1.5 p-1 bg-slate-900/50 rounded-lg border border-slate-800">
        <button (click)="onExport()" 
                class="h-8 px-3 flex items-center gap-1.5 rounded-md hover:bg-slate-700 text-slate-300 hover:text-slate-100 transition-all text-xs font-medium"
                title="Export Lab (Ctrl+E)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
          </svg>
          Export
        </button>

        <button (click)="fileInput.click()" 
                class="h-8 px-3 flex items-center gap-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white transition-all text-xs font-medium shadow-lg shadow-indigo-500/25"
                title="Import Lab (Ctrl+I)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          Import
        </button>
      </div>

      <input type="file" #fileInput class="hidden" (change)="onImport($event)" accept=".yaml,.yml">

      <div class="h-6 w-px bg-slate-800"></div>

      <!-- Danger Zone -->
      <button (click)="onCleanupLab()"
              class="h-8 px-3 flex items-center gap-1.5 rounded-md hover:bg-red-900/30 text-slate-400 hover:text-red-400 transition-all text-xs font-medium border border-transparent hover:border-red-800/50"
              title="Reset Lab - Delete all nodes (Ctrl+Shift+R)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        Reset
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex overflow-hidden">
      
      <!-- Left: Component Library (Fixed) -->
      <app-node-palette class="shrink-0" [nodes]="store.topology().nodes" (addNode)="onAddNode($event)"></app-node-palette>

      <!-- Center: Canvas -->
      <div class="flex-1 flex flex-col min-w-0 bg-slate-950 h-full relative">
          <!-- Canvas Area -->
          <div class="flex-1 relative overflow-hidden">
            <app-topology-canvas
                [nodes]="store.topology().nodes"
                [links]="store.topology().links"
                [terminalNode]="terminalStore.activeNodeId()"
                [domains]="store.domains()"
                [activeDomainOverlay]="store.activeDomainOverlay()"
                [traceroutePath]="tracerouteResult()"
                (linkRequest)="onLinkRequest($event)"
                (nodeMoved)="store.updateNodePosition($event.id, $event.x, $event.y)"
                (openTerminalRequest)="openTerminal($event)"
                (openSniffRequest)="captureStore.openCapture($event.nodeId, $event.nodeName, $event.iface)"
                (tracerouteRequest)="onTraceroute($event)"
                (tracerouteClose)="clearTraceroute()"
                (nodeSelected)="onNodeSelected($event)"
                (linkSelected)="onLinkSelected($event)"
                (nodeDelete)="onDeleteNode($event)"
                (linkDelete)="onDeleteLink($event)"
                (linkToggle)="onToggleLink($event)"
                (nodePowerToggle)="store.toggleNodePower($event)">
            </app-topology-canvas>
          </div>
          
          <!-- Integrated Terminal (Only takes space from center) -->
          <div *ngIf="terminalStore.isOpen()"
               class="border-t border-slate-700 bg-slate-900 shrink-0 z-10 overflow-hidden flex flex-col"
               [style.height.px]="terminalHeight()">
            <!-- Drag handle -->
            <div class="h-2 bg-slate-700 hover:bg-blue-500 cursor-ns-resize shrink-0 transition-colors"
                 (mousedown)="onResizeStart($event)"
                 (dblclick)="terminalHeight.set(DEFAULT_TERMINAL_HEIGHT)"></div>
            <app-terminal-panel class="flex-1 min-h-0"></app-terminal-panel>
          </div>
      </div>

      <!-- Right: Properties Inspector (Fixed) -->
      <app-properties-panel *ngIf="selectedNode() || selectedLink()" class="shrink-0"
          [selectedNode]="selectedNode()"
          [selectedLink]="selectedLink()"
          (openTerminal)="selectedNode() && openTerminal(selectedNode()!.id)"
          (openCapture)="onOpenCapture($any($event))"
          (deleteNode)="onDeleteNode($event)"
          (deleteLink)="onDeleteLink($event)"
          (close)="onNodeSelected(null)">
      </app-properties-panel>
  </div>

  <!-- Floating Windows Layer (Captures) -->
  <app-capture-container></app-capture-container>

  <!-- Global Toasts -->
  <app-toast></app-toast>

  <!-- Lab Manager Modal -->
  <app-lab-manager *ngIf="ui.isLabManagerOpen()" (close)="ui.toggleLabManager(false)"></app-lab-manager>

  <!-- Welcome / Start Screen -->
  <app-welcome-modal
    *ngIf="showWelcomeModal()"
    (createLab)="ui.markInteraction()"
    (importLab)="fileInput.click()"
    (openLabManager)="ui.toggleLabManager(true)"
    (close)="ui.markInteraction()">
  </app-welcome-modal>
</div>
